name: Bridgy

options:
  bundleIdPrefix: ch.pandermatt
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"
  minimumXcodeGenVersion: "2.46.0"

packages:
  BridgyEngine:
    path: BridgyEngine

targets:
  Bridgy:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: Bridgy
        type: syncedFolder
    dependencies:
      - target: BridgyWidgets
        destinationFilters: [iOS]
      - package: BridgyEngine
        product: BridgyEngine
      - package: BridgyEngine
        product: BridgyTraining
      - package: BridgyEngine
        product: BridgyLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.bridgy
        PRODUCT_NAME: Bridgy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEVELOPMENT_TEAM: 692NM4E836
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Bridgy
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Bridgy can suggest a song to celebrate a win and play a short preview."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # SDK conditions belong on the setting key. As a sibling of `base:`,
        # XcodeGen reads `[sdk=...]` as a build-configuration name and silently
        # drops the whole block.
        #
        # Orientation and launch screens mean nothing on visionOS; the hardened
        # runtime is macOS-only. And the multiplatform target otherwise inherits
        # an "iPhone Developer" identity that macOS cannot satisfy without a
        # team, so macOS signs ad-hoc, which is what a local build wants.
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # An immersive space is a second scene, and visionOS refuses to open one
        # without UIApplicationSupportsMultipleScenes. There is no
        # INFOPLIST_KEY_ alias for that — setting one is silently ignored — so
        # visionOS gets a real plist, merged with the generated keys. Scoped by
        # SDK so iPad multi-window behaviour is left alone.
        INFOPLIST_FILE[sdk=xr*]: Support/VisionInfo.plist
        # Agent files (.bridgyagent) on iPhone, iPad and Mac.
        INFOPLIST_FILE[sdk=iphone*]: Support/AppInfo.plist
        INFOPLIST_FILE[sdk=macosx*]: Support/AppInfo.plist
        INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphone*]: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Support/Bridgy-iOS.entitlements
        # Opened agent files are copied in, not edited where they lie. macOS
        # refuses NO here, so it is set for iPhone and iPad only.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=iphone*]: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"

  # Live Activities for training and experiments. iPhone and iPad only.
  BridgyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BridgyWidgets
    dependencies:
      - package: BridgyEngine
        product: BridgyLive
    info:
      path: BridgyWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.bridgy.widgets
        PRODUCT_NAME: BridgyWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bridgy
        DEVELOPMENT_TEAM: 692NM4E836
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: BridgyWidgets/BridgyWidgets.entitlements
